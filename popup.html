<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>喵喵视频下载姬</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部可爱猫耳导航栏 -->
    <header class="header">
      <div class="cat-ears">
        <span class="ear left-ear"></span>
        <span class="ear right-ear"></span>
      </div>
      <div class="title-row">
        <span class="sparkle">✨</span>
        <h1 class="title">喵喵视频下载姬</h1>
        <span class="sparkle">✨</span>
      </div>
      <p class="subtitle">(◕ᴗ◕✿) 为你捕捉每一帧心动~</p>
    </header>

    <!-- 当前网页信息条 -->
    <div class="page-bar">
      <span class="page-icon">🌐</span>
      <span class="page-title" id="pageTitle">正在连接网页...</span>
    </div>

    <!-- 极速捕捉状态条 -->
    <div class="status-bar" id="statusBar">
      <div class="status-left">
        <span class="status-radar"></span>
        <span id="statusText">正在捕捉视频信号中喵... (✧ω✧)</span>
      </div>
      <button class="btn-icon" id="btnRefresh" title="强制刷新">🔄</button>
    </div>

    <!-- 视频列表容器 -->
    <main class="media-list" id="mediaList">
      <!-- 动态渲染 -->
    </main>

    <!-- 底部可爱版权/提示 -->
    <footer class="footer">
      <span>(=^･ω･^=) 极速高频嗅探中 · 仅供学习交流使用哦</span>
    </footer>
  </div>

  <!-- 截图大图预览弹窗 -->
  <div class="modal" id="imageModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalTimeTag">⏱️ 截屏时间: 00:00</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <img id="modalImg" class="modal-img" src="" alt="截屏预览">
      <div class="modal-actions">
        <button class="btn btn-primary" id="btnSaveFrame">
          <span>💾</span> 保存该帧截图 (JPG)
        </button>
      </div>
    </div>
  </div>

  <!-- 萌系悬浮 Toast 提示 -->
  <div class="toast" id="toast"></div>

  <script src="popup.js"></script>
</body>
</html>
